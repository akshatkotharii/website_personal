<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Akshat Kothari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: #fff; color: #0F0F0F;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem; -webkit-font-smoothing: antialiased;
    }
    .wrap { text-align: center; max-width: 400px; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9A9A96; text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 42px; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { font-size: 15px; color: #5C5C58; line-height: 1.7; margin-bottom: 2rem; }
    a { display: inline-block; background: #0F0F0F; color: white; font-size: 14px; font-weight: 500; padding: 11px 24px; border-radius: 8px; text-decoration: none; transition: background 0.18s; }
    a:hover { background: #1A1AFF; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404 — Not found</p>
    <h1>Wrong turn.</h1>
    <p>This page doesn't exist. If you're looking for something specific, head back home.</p>
    <a href="index.html">← Back home</a>
  </div>
</body>
</html>
