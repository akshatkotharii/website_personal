<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Akshat Kothari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/instrumentserif/v5/jizBRFtNs2ka5fXjeivQ4LroWlx-6zUTjg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/travel-post.css">
  <style>
    body { min-height: 100vh; background: var(--white); }

    .post-wrap {
      max-width: 760px; margin: 0 auto;
      padding: 0 clamp(1.25rem, 5vw, 2.5rem);
      padding-top: calc(var(--offset) + 40px);
      padding-bottom: 64px;
    }

    .post-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent);
      text-decoration: none; margin-bottom: 1.75rem; transition: opacity 0.18s;
    }
    .post-back:hover { opacity: 0.65; }

    .post-meta {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      font-family: var(--mono); font-size: 11px; color: var(--gray-400); margin-bottom: 0.75rem;
    }
    .post-meta-tag { background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 10px; }

    .post-title {
      font-family: var(--serif); font-size: clamp(28px, 5vw, 50px);
      letter-spacing: -0.03em; line-height: 1.08; color: var(--black); margin-bottom: 1.5rem;
    }
    .post-divider { width: 36px; height: 2px; background: var(--accent); margin-bottom: 1.75rem; }
    .post-thread { margin: 0 0 2.5rem; padding: 1.1rem 1.25rem; background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: var(--radius-md); }
    .post-thread-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 0.8rem; }
    .post-thread-item { display: flex; gap: 0.8rem; align-items: baseline; padding: 0.65rem 0; border-top: 1px solid var(--gray-100); text-decoration: none; color: var(--black); }
    .post-thread-item:first-of-type { border-top: 0; }
    .post-thread-item:hover .post-thread-title { color: var(--accent); }
    .post-thread-date { width: 78px; flex: 0 0 78px; font-family: var(--mono); font-size: 10px; color: var(--gray-400); }
    .post-thread-title { font-size: 13px; line-height: 1.4; transition: color 0.18s; }
    .post-thread-current { color: var(--accent); font-family: var(--mono); font-size: 10px; }

    .post-body { --reading-scale: 1; font-size: calc(18px * var(--reading-scale)); line-height: 1.72; color: var(--gray-600); }
    .post-body h2 { font-family: var(--serif); font-size: calc(29px * var(--reading-scale)); color: var(--black); letter-spacing: -0.02em; margin: 2rem 0 .75rem; line-height: 1.2; }
    .post-body h3 { font-family: var(--sans); font-size: calc(17px * var(--reading-scale)); font-weight: 600; color: var(--black); margin: 1.5rem 0 0.6rem; }
    .post-body p { margin-bottom: .95rem; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body .story-lede, .post-body .alias-hero-copy, .post-body .cef-lede,
    .post-body .spin-scene-copy, .post-body .story-callout, .post-body .cef-note,
    .post-body .alias-boundary p { font-size:calc(17px * var(--reading-scale)); }
    .post-body hr { border: 0; border-top: 1px solid var(--gray-200); margin: 2rem 0 1.75rem; }
    .post-body strong { color: var(--black); font-weight: 500; }
    .post-body em { font-style: italic; }
    .post-body a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-soft); }
    .post-body a:hover { text-decoration-color: var(--accent); }
    .post-body code { font-family: var(--mono); font-size: 14px; background: var(--gray-50); border: 1px solid var(--gray-100); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
    .post-body pre { background: var(--black); color: #e2e8f0; padding: 1.25rem 1.5rem; border-radius: var(--radius-md); overflow-x: auto; margin: 1.5rem 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.7; }
    .post-body pre code { background: none; border: none; padding: 0; color: inherit; }
    .post-body blockquote { border-left: 3px solid var(--accent); margin: 1.5rem 0; padding: 0.4rem 1.25rem; color: var(--black); font-family: var(--serif); font-size: calc(22px * var(--reading-scale)); font-style: italic; line-height: 1.5; }
    .post-body ul, .post-body ol { padding-left: 1.5rem; margin-bottom: .95rem; }
    .post-body li { margin-bottom: 0.4rem; }
    .post-body figure { margin: 2rem 0; }
    .post-body img {
      display: block; width: 100%; max-width: 100%; height: auto;
      border-radius: var(--radius-md); border: 1px solid var(--gray-100);
    }
    .post-body figcaption {
      margin-top: 0.6rem; font-family: var(--mono); font-size: 11px;
      color: var(--gray-400); text-align: center; line-height: 1.5;
    }
    .post-body span[style*="font-family"] { line-height: inherit; }

    /* ── ALIASEARCH ── */
    .alias-hero {
      position: relative; overflow: hidden; margin: 0 0 2.5rem; padding: clamp(1.5rem, 5vw, 2.75rem);
      color: #f8f6ef; background: #173744; border-radius: var(--radius-md);
    }
    .alias-hero::after { content: ''; position: absolute; inset: 0; opacity: 0.16; background-image: radial-gradient(#f8f6ef 1px, transparent 1px); background-size: 17px 17px; pointer-events: none; }
    .alias-hero > * { position: relative; z-index: 1; }
    .alias-overline { margin: 0 0 1.25rem !important; font: 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; color: #f3ca83; }
    .post-body .alias-name { margin: 0 !important; color: #fffdf6; font: clamp(42px, 10vw, 72px)/.88 var(--serif); letter-spacing: -.055em; }
    .alias-hero-copy { max-width: 32rem; margin: 1.25rem 0 0 !important; color: #d9e5e5; font-size: clamp(17px, 2.8vw, 21px); line-height: 1.45; }
    .alias-github { display: inline-flex; margin-top: 1.75rem; padding-bottom: 3px; border-bottom: 1px solid #f3ca83; color: #fffdf6 !important; text-decoration: none !important; font: 12px var(--mono); }
    .alias-github:hover { color: #f3ca83 !important; }
    .alias-statement { margin: 2.5rem 0 !important; color: var(--black); font: 29px/1.25 var(--serif); letter-spacing: -.025em; }
    .alias-flow { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; margin: 2rem 0 2.5rem; border: 1px solid #d7e1de; background: #d7e1de; border-radius: var(--radius-md); overflow: hidden; }
    .alias-step { min-height: 175px; padding: 1.2rem; background: #fcfcfa; }
    .alias-step-number { display: block; margin-bottom: 2rem; color: #427284; font: 11px var(--mono); letter-spacing: .1em; }
    .alias-step h3 { margin: 0 0 .45rem !important; font: 22px/1.05 var(--serif) !important; font-weight: 400 !important; }
    .alias-step p { margin: 0 !important; font-size: 13px; line-height: 1.55; }
    .alias-gates { margin: 2.5rem 0; padding: clamp(1.25rem, 4vw, 2rem); color: #e9f0ef; background: #173744; border-radius: var(--radius-md); }
    .alias-gates h2 { margin: 0 0 1.35rem !important; color: #f3ca83 !important; font: 11px var(--mono) !important; letter-spacing: .12em; text-transform: uppercase; }
    .alias-gate { display: grid; grid-template-columns: 115px 1fr; gap: 1rem; padding: .85rem 0; border-top: 1px solid rgba(233,240,239,.22); }
    .alias-gate strong { color: #fffdf6 !important; font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .alias-gate span { color: #d9e5e5; font-size: 14px; line-height: 1.5; }
    .alias-boundary { margin: 2.5rem 0; padding: 1.4rem 1.5rem; border-left: 3px solid #c68a62; background: #fbf1e8; color: #4b413c; }
    .alias-boundary strong { display: block; margin-bottom: .45rem; color: #3b2e27; font-family: var(--serif); font-size: 22px; font-weight: 400; }
    .alias-boundary p { margin: 0 !important; font-size: 15px; line-height: 1.6; }
    .cef-hero { position:relative; overflow:hidden; margin:0 0 2rem; padding:clamp(1.25rem,4vw,2.25rem); border:1px solid #dce6db; border-radius:var(--radius-md); color:#183528; background:linear-gradient(135deg,#f5f7f1,#edf3eb); }
    .cef-hero::before { content:''; position:absolute; width:clamp(150px,28vw,260px); aspect-ratio:1; right:-5%; top:12%; border:clamp(16px,3vw,32px) solid #d3e1d0; border-radius:50%; box-shadow:inset 0 0 0 clamp(14px,3vw,28px) #e5ead9, inset 0 0 0 clamp(32px,6vw,60px) #f1f5ed; opacity:.78; }
    .cef-hero > * { position:relative; z-index:1; }
    .cef-brand { display:flex; align-items:center; gap:.8rem; margin-bottom:1rem; }
    .cef-brand img { width:64px; height:64px; flex:0 0 64px; object-fit:contain; border-radius:5px; background:#fff; }
    .cef-brand strong { display:block; color:#183528; font:600 13px/1.35 var(--sans); }
    .cef-brand small { display:block; margin-top:3px; color:#68776c; font:10px/1.5 var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .cef-overline { margin:0 0 .65rem!important; color:#477451; font:10px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    .post-body .cef-title { max-width:14ch; margin:0!important; color:#172c21!important; font:clamp(36px,7vw,60px)/.98 var(--serif)!important; letter-spacing:-.04em; }
    .cef-lede { max-width:34rem; margin:.85rem 0 0!important; color:#4c6253; font-size:clamp(15px,2.4vw,18px); line-height:1.55; }
    .cef-link { display:inline-flex; margin-top:1.15rem; padding-bottom:3px; border-bottom:1px solid #719875; color:#245b39!important; font:11px var(--mono); text-decoration:none!important; }
    .cef-link:hover { color:#0c4024!important; }
    .cef-belief { margin:1.75rem 0!important; padding:clamp(1.1rem,3.5vw,1.6rem); border:1px solid #d9e5d5; border-radius:var(--radius-md); color:#263d2e; background:#f0f5ed; }
    .cef-belief small { display:block; margin-bottom:.55rem; color:#527958; font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    .cef-belief strong { display:block; color:#20382a!important; font:clamp(20px,3.5vw,27px)/1.28 var(--serif); font-weight:400; }
    .cef-steps { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; margin:1.25rem 0 2rem; overflow:hidden; border:1px solid #dce5e1; border-radius:var(--radius-md); background:#dce5e1; }
    .cef-step { min-height:145px; padding:1.15rem; background:#fbfcf8; }
    .cef-step b { display:block; margin-bottom:1.1rem; color:#008f83; font:11px var(--mono); letter-spacing:.1em; }
    .cef-step strong { display:block; margin-bottom:.35rem; color:#0b2d43!important; font:22px/1.1 var(--serif); font-weight:400; }
    .cef-step span { display:block; color:var(--gray-600); font-size:13px; line-height:1.5; }
    .cef-note { margin:1.5rem 0; padding:1rem 1.15rem; border-left:3px solid #83a57d; background:#f0f5ed; color:#354b3a; font-size:14px; line-height:1.6; }
    .cef-note strong { color:#20382a!important; }
    @media(max-width:540px){.cef-steps{grid-template-columns:1fr}.cef-step{min-height:0}.cef-hero::before{right:-22%;top:8%;opacity:.4}.post-body .cef-title{max-width:11ch}.cef-brand img{width:56px;height:56px;flex-basis:56px}}

    /* Project stories: light, compact diagrams with small motion cues. */
    .story-hero { position:relative; overflow:hidden; margin:0 0 1.75rem; padding:clamp(1.25rem,4vw,2rem); border:1px solid var(--gray-100); border-radius:var(--radius-md); background:#f4f3ed; color:var(--black); }
    .story-hero > * { position:relative; z-index:1; }
    .story-kicker { margin:0 0 .7rem!important; color:var(--gray-600); font:10px var(--mono); letter-spacing:.13em; text-transform:uppercase; }
    .post-body .story-title { position:relative; z-index:1; max-width:16ch; margin:0!important; color:var(--black)!important; font:clamp(34px,6.5vw,54px)/1 var(--serif)!important; letter-spacing:-.04em; }
    .story-lede { position:relative; z-index:1; max-width:38rem; margin:.75rem 0 0!important; color:#56564f; font-size:clamp(15px,2.3vw,18px); line-height:1.55; }
    .story-link { display:inline-flex; margin-top:1rem; color:var(--accent)!important; font:11px var(--mono); text-decoration:none!important; border-bottom:1px solid currentColor; }
    .story-link:hover { opacity:.72; }
    .story-flow { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:1.2rem 0 1.8rem; }
    .story-flow-card { position:relative; min-height:112px; padding:.9rem; border:1px solid var(--gray-100); border-radius:10px; background:#fff; }
    .story-flow-card b { display:block; margin-bottom:1.2rem; color:var(--accent); font:10px var(--mono); letter-spacing:.1em; }
    .story-flow-card strong { display:block; color:var(--black)!important; font:19px/1.1 var(--serif); font-weight:400; }
    .story-flow-card span { display:block; margin-top:.3rem; color:var(--gray-600); font-size:12px; line-height:1.45; }
    .story-callout { margin:1.4rem 0; padding:1rem 1.15rem; border-left:3px solid var(--accent); background:#f3f3fb; color:#393949; font-size:14px; line-height:1.6; }
    .story-callout strong { color:var(--black)!important; }
    .nudgen-hero { background:linear-gradient(120deg,#f5f3ea,#edf2ef); }
    .nudgen-hero::after { content:''; position:absolute; z-index:0; width:150px; height:150px; right:-42px; bottom:-65px; border:20px solid #dce8df; border-radius:50%; box-shadow:inset 0 0 0 16px #edf2ef,0 0 0 14px #e7e9df; opacity:.85; pointer-events:none; }
    .nudgen-workflow { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:1.25rem 0 1.75rem; }
    .nudgen-step { min-height:105px; padding:.85rem; border-top:2px solid #688b73; background:#f4f6f1; }
    .nudgen-step b { display:block; margin-bottom:1rem; color:#688b73; font:10px var(--mono); }
    .nudgen-step strong { color:var(--black)!important; font:18px/1.1 var(--serif); font-weight:400; }
    .spin-hero { background:#f4f3ee; border-color:#e4e2da; }
    .spin-scene { display:flex; align-items:center; gap:1rem; margin:1.3rem 0 .25rem; }
    .spin-washer { display:grid; width:82px; height:82px; flex:0 0 82px; place-items:center; border:1.5px solid #77766e; border-radius:14px; background:#f8f7f2; }
    .spin-drum { position:relative; width:50px; height:50px; border:2px solid #77766e; border-radius:50%; background:#e8e6de; animation:spin-drum 8s linear infinite; }
    .spin-drum::after { content:''; position:absolute; width:8px; height:8px; left:8px; top:11px; border-radius:50%; background:#fbfaf6; box-shadow:21px 16px 0 #d5d3cb,7px 24px 0 #f5f3ec; }
    @keyframes spin-drum { to { transform:rotate(360deg); } }
    .spin-scene-copy { color:#555a57; font-size:13px; line-height:1.5; }
    .spin-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:1.25rem 0 1.5rem; }
    .spin-stat { padding:.9rem; border:1px solid #e2e4df; border-radius:9px; background:#fbfbf8; }
    .spin-stat strong { display:block; color:#273b3e!important; font:30px/1 var(--serif); font-weight:400; }
    .spin-stat span { display:block; margin-top:.4rem; color:var(--gray-600); font-size:11px; line-height:1.4; }
    .spin-system { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:1rem 0 1.5rem; }
    .spin-system span { padding:.7rem .6rem; border:1px solid #e3e5df; border-radius:8px; background:#f5f6f1; color:#3f4b49; font:10px/1.4 var(--mono); text-align:center; }
    .energy-hero { background:linear-gradient(120deg,#f2f5ef,#eef2f4); }
    .energy-hero::after { content:''; position:absolute; z-index:0; width:170px; height:170px; right:-55px; top:-90px; border:26px solid #dbe8d7; border-radius:50%; box-shadow:0 0 0 18px #e8eee5; pointer-events:none; }
    .energy-route { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:1.1rem 0 1.6rem; }
    .energy-node { position:relative; padding:.9rem .75rem; border:1px solid #dfe7dc; border-radius:9px; background:#f7faf5; }
    .energy-node b { display:block; margin-bottom:.85rem; color:#477451; font:10px var(--mono); }
    .energy-node strong { display:block; color:#20382a!important; font:18px/1.1 var(--serif); font-weight:400; }
    .energy-node span { display:block; margin-top:.35rem; color:#5d6b60; font-size:11px; line-height:1.45; }
    .energy-layers { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:1.2rem 0 1.6rem; }
    .energy-layer { padding:1rem; border:1px solid #dfe6dc; border-radius:9px; background:#f7f9f5; }
    .energy-layer b { display:block; margin-bottom:.45rem; color:#477451; font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .energy-layer strong { display:block; margin-bottom:.35rem; color:#20382a!important; font:20px/1.1 var(--serif); font-weight:400; }
    .energy-layer p { margin:0!important; font-size:12px; line-height:1.55; }
    .energy-checkpoint { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:1rem 0 1.5rem; }
    .energy-checkpoint > div { padding:.85rem; border-top:2px solid #9ab696; background:#f4f6f1; }
    .energy-checkpoint b { display:block; margin-bottom:.55rem; color:#527958; font:10px var(--mono); }
    .energy-checkpoint strong { display:block; color:var(--black)!important; font:17px/1.15 var(--serif); font-weight:400; }
    .energy-checkpoint span { display:block; margin-top:.35rem; color:var(--gray-600); font-size:11px; line-height:1.45; }
    .story-details { margin:1rem 0; border:1px solid var(--gray-200); border-radius:9px; background:#fafaf8; }
    .story-details summary { padding:.8rem 1rem; color:var(--black); cursor:pointer; font:12px var(--mono); }
    .story-details > div { padding:0 1rem .9rem; color:var(--gray-600); font-size:13px; line-height:1.6; }
    .story-details > div p { margin:0!important; }
    .reading-size { display:flex; align-items:center; justify-content:flex-end; gap:.65rem; margin:-.25rem 0 1.6rem; color:var(--gray-600); font:11px var(--mono); }
    .reading-size-label { white-space:nowrap; }
    .reading-size-control { display:flex; align-items:center; gap:.55rem; }
    .reading-size-large-a { font-size:16px; }
    .reading-size input { appearance:none; width:min(150px,30vw); height:24px; margin:0; background:transparent; cursor:pointer; touch-action:pan-x; }
    .reading-size input::-webkit-slider-runnable-track { height:3px; border-radius:3px; background:var(--gray-200); }
    .reading-size input::-moz-range-track { height:3px; border-radius:3px; background:var(--gray-200); }
    .reading-size input::-webkit-slider-thumb { appearance:none; width:14px; height:14px; margin-top:-5.5px; border:2px solid var(--white); border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .reading-size input::-moz-range-thumb { width:11px; height:11px; border:2px solid var(--white); border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .reading-size-value { min-width:3.2em; color:var(--gray-400); text-align:right; font-variant-numeric:tabular-nums; }
    .reading-size input:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:4px; }
    .article-progress { position:fixed; z-index:1001; inset:0 0 auto; height:2px; pointer-events:none; background:transparent; }
    .article-progress span { display:block; width:100%; height:100%; background:var(--accent); transform:scaleX(0); transform-origin:left center; }
    .article-map { margin:0 0 2rem; padding:1rem 0 .9rem; border-top:1px solid var(--gray-100); border-bottom:1px solid var(--gray-100); }
    .article-map-top { display:flex; justify-content:space-between; gap:1rem; margin-bottom:.7rem; color:var(--gray-400); font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .article-map-links { display:flex; gap:.45rem; overflow-x:auto; padding:2px 1px 5px; scrollbar-width:thin; scrollbar-color:var(--gray-200) transparent; }
    .article-map-links a { flex:0 0 auto; max-width:220px; padding:.45rem .65rem; border:1px solid var(--gray-100); border-radius:999px; color:var(--gray-600); background:var(--white); font:11px/1.35 var(--mono); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .18s,border-color .18s,background .18s; }
    .article-map-links a:hover,.article-map-links a[aria-current="true"] { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
    .post-body h2[id] { scroll-margin-top:5rem; }
    @media(max-width:720px){.cef-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.story-flow,.nudgen-workflow,.energy-route{grid-template-columns:repeat(2,minmax(0,1fr))}.spin-system{grid-template-columns:repeat(2,minmax(0,1fr))}.story-flow-card{min-height:95px}.energy-checkpoint{grid-template-columns:1fr}.spin-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.spin-stat{padding:.7rem}.spin-stat strong{font-size:26px}}
    @media(max-width:420px){.energy-layers{grid-template-columns:1fr}.spin-stats{grid-template-columns:1fr}.spin-scene{align-items:flex-start}.spin-washer{width:68px;height:68px;flex-basis:68px}.spin-drum{width:43px;height:43px}}
    @media(max-width:520px){.reading-size{justify-content:space-between;gap:.5rem;margin:-.2rem 0 1.25rem}.reading-size-control{gap:.4rem}.reading-size input{width:clamp(90px,36vw,150px)}.post-body{font-size:calc(17px * var(--reading-scale));line-height:1.75}.post-body h2{font-size:calc(27px * var(--reading-scale))}}
    @media(max-width:520px){.article-map{margin-bottom:1.5rem}.article-map-top{font-size:9px}.article-map-links a{max-width:180px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){.article-map-links a{transition:none}}
    @media(prefers-reduced-motion:reduce){.spin-drum{animation:none}}
    @media (max-width: 540px) {
      .alias-flow { grid-template-columns: 1fr; }
      .alias-step { min-height: 0; }
      .alias-step-number { margin-bottom: 1.25rem; }
      .alias-gate { grid-template-columns: 1fr; gap: .35rem; }
    }

    .post-pdf { margin-top: 2.25rem; overflow: hidden; border: 1px solid var(--gray-100); border-radius: var(--radius-md); background: var(--gray-50); }
    .post-pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.85rem 1rem; font-family: var(--mono); font-size: 11px; color: var(--gray-600); }
    .post-pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .post-pdf-bar a:hover { text-decoration: underline; }
    .post-pdf-viewer { display: block; width: 100%; height: min(80vh, 980px); min-height: 680px; border: 0; background: white; }

    /* ── IMG GRID (photo / chart grids from Word docs) ── */
    .post-body .img-grid {
      display: grid; gap: 0.75rem; margin: 2rem 0;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .post-body .img-grid[data-cols="1"] { grid-template-columns: 1fr; }
    .post-body .img-grid[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
    .post-body .img-grid[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
    .post-body .img-grid[data-cols="4"] { grid-template-columns: repeat(4, 1fr); }
    .post-body .img-grid-cell { margin: 0; }
    .post-body .img-grid-cell img {
      width: 100%; height: auto; border-radius: var(--radius-md);
      border: 1px solid var(--gray-100); display: block;
      object-fit: contain;
    }
    .post-body .img-grid-cell figcaption {
      font-family: var(--mono); font-size: 10px; color: var(--gray-400);
      text-align: center; margin-top: 0.35rem;
    }
    @media (max-width: 600px) {
      .post-thread-item { gap: 0.55rem; }
      .post-thread-date { width: 66px; flex-basis: 66px; }
      .post-body .img-grid[data-cols="3"],
      .post-body .img-grid[data-cols="4"] { grid-template-columns: repeat(2, 1fr); }
      .post-body .img-grid[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── DATA TABLES (text/stat tables from Word docs) ── */
    .post-body table {
      width: 100%; border-collapse: collapse; margin: 2rem 0;
      font-size: 15px; line-height: 1.5; overflow-x: auto; display: block;
    }
    .post-body th, .post-body td {
      padding: 10px 14px; border: 1px solid var(--gray-200);
      text-align: left; vertical-align: top;
    }
    .post-body th {
      background: var(--gray-50); font-weight: 600;
      font-family: var(--mono); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-600);
    }
    .post-body tr:nth-child(even) td { background: var(--gray-50); }


    /* ── LIKES ── */
    .post-engagement {
      display: flex; align-items: center; gap: 1rem;
      margin-top: 3rem; padding: 1.5rem;
      background: var(--gray-50); border-radius: var(--radius-md);
      border: 1px solid var(--gray-100);
    }
    .like-btn {
      display: flex; align-items: center; gap: 8px;
      background: none; border: 1.5px solid var(--gray-200);
      padding: 10px 18px; border-radius: 100px; cursor: pointer;
      font-family: var(--sans); font-size: 14px; font-weight: 500;
      color: var(--gray-600); transition: all 0.18s;
    }
    .like-btn:hover { border-color: #FF4B6E; color: #FF4B6E; }
    .like-btn.liked { background: #FFF0F3; border-color: #FF4B6E; color: #FF4B6E; }
    .like-btn .like-icon { font-size: 16px; transition: transform 0.2s; }
    .like-btn:hover .like-icon, .like-btn.liked .like-icon { transform: scale(1.2); }
    .like-count { font-family: var(--mono); font-size: 13px; color: var(--gray-400); }

    /* ── COMMENTS ── */
    .comments-section { margin-top: 3rem; }
    .comments-title {
      font-family: var(--serif); font-size: 24px; letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .comments-sub { font-size: 13px; color: var(--gray-400); font-family: var(--mono); margin-bottom: 2rem; }

    .comment-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 2rem; }
    .comment-item {
      padding: 1.25rem 0; border-bottom: 1px solid var(--gray-100);
    }
    .comment-item:first-child { border-top: 1px solid var(--gray-100); }
    .comment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
    .comment-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .comment-name { font-size: 13px; font-weight: 600; color: var(--black); }
    .comment-date { font-family: var(--mono); font-size: 10px; color: var(--gray-400); margin-left: auto; }
    .comment-text { font-size: 14px; color: var(--gray-600); line-height: 1.7; padding-left: 40px; }
    .comment-empty { font-family: var(--mono); font-size: 12px; color: var(--gray-400); padding: 1.5rem 0; }

    /* ── COMMENT FORM ── */
    .comment-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .comment-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .comment-input, .comment-textarea {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
      font-family: var(--sans); font-size: 14px; color: var(--black);
      background: var(--white); outline: none; transition: border-color 0.18s;
    }
    .comment-input:focus, .comment-textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .comment-textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
    .comment-submit {
      align-self: flex-start; padding: 10px 22px;
      background: var(--black); color: white; border: none;
      border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: var(--sans); transition: background 0.18s;
    }
    .comment-submit:hover { background: var(--accent); }
    .comment-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .comment-notice {
      font-family: var(--mono); font-size: 11px; color: var(--gray-400);
      padding: 8px 0;
    }
    .comment-notice.ok { color: #22C55E; }
    .comment-notice.err { color: #EF4444; }

    .post-footer {
      margin-top: 4rem; padding-top: 2rem;
      border-top: 1px solid var(--gray-100);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    .post-footer-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 500; color: var(--black);
      text-decoration: none; border-bottom: 1.5px solid var(--gray-200);
      padding-bottom: 2px; transition: color 0.18s, border-color 0.18s;
    }
    .post-footer-back:hover { color: var(--accent); border-color: var(--accent); }
    .not-found { text-align: center; padding: 4rem 2rem; color: var(--gray-400); }
    .not-found h2 { font-family: var(--serif); font-size: 28px; color: var(--black); margin-bottom: 0.5rem; }

    @media (max-width: 500px) {
      .comment-form-row { grid-template-columns: 1fr; }
      .post-pdf-viewer { height: 72vh; min-height: 520px; }
    }
  </style>
